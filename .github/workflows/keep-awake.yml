name: Keep the hosted app awake

# Streamlit Community Cloud puts an app to sleep after 12 hours without a
# visitor, which is why https://containment.streamlit.app/ shows the "Zzzz"
# page while a local `streamlit run` never does. A plain HTTP request does not
# count as a visit (it only gets the static sleep page), so this job opens the
# app in a real headless browser every 4 hours, clicks "Yes, get this app back
# up!" if the app is asleep, and waits until the app itself has loaded.
#
# It makes no commits, so it does not trigger CI or a redeploy. If the app
# fails to load (for example, it crashed on start-up), the run fails, GitHub
# emails you, and a screenshot of the page is attached to the run.

on:
  schedule:
    - cron: "23 */4 * * *" # every 4 hours, at minute 23 (UTC)
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: read

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  visit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_URL: https://containment.streamlit.app/
      WAIT_SECONDS: "300"
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install a headless browser
        run: |
          python -m pip install --upgrade pip
          pip install "playwright>=1.48"
          python -m playwright install --with-deps chromium

      - name: Visit the app and wake it if it is asleep
        run: |
          python - <<'EOF'
          import os
          import re
          import sys
          import time

          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          wait_s = int(os.environ.get("WAIT_SECONDS", "300"))
          wake_label = re.compile(r"get this app back up", re.I)
          # Present only once the Streamlit app itself is running. On
          # streamlit.app it sits inside an iframe, so every frame is checked.
          app_ready = '[data-testid="stAppViewContainer"]'


          def app_is_loaded(page):
              for frame in page.frames:
                  try:
                      if frame.locator(app_ready).count():
                          return True
                  except Exception:
                      pass  # frame navigated away mid-check
              return False


          def wake_button(page):
              for frame in page.frames:
                  try:
                      button = frame.get_by_role("button", name=wake_label)
                      if button.count():
                          return button.first
                  except Exception:
                      pass
              return None


          with sync_playwright() as p:
              browser = p.chromium.launch(channel=os.environ.get("BROWSER_CHANNEL") or None)
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=90_000)

              woke = False
              last_click = float("-inf")
              deadline = time.monotonic() + wait_s
              while time.monotonic() < deadline:
                  if app_is_loaded(page):
                      print(f"App is awake{' (woken from sleep)' if woke else ''}: {url}")
                      page.wait_for_timeout(20_000)  # stay connected so the visit counts
                      browser.close()
                      sys.exit(0)
                  button = wake_button(page)
                  if button is not None and time.monotonic() - last_click > 30:
                      print("App was asleep. Clicking the wake button.")
                      button.click()
                      woke = True
                      last_click = time.monotonic()
                  page.wait_for_timeout(5_000)

              page.screenshot(path="keep-awake-failure.png", full_page=True)
              browser.close()
              sys.exit(f"The app did not finish loading within {wait_s} s: {url}")
          EOF

      - name: Save a screenshot if the app did not load
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep-awake-failure.png
          if-no-files-found: ignore
          retention-days: 7
